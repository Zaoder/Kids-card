<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<title>Ζωάκια</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{font-family:"Comic Sans MS","Chalkboard SE",system-ui,-apple-system,Roboto,sans-serif;
    background:linear-gradient(180deg,#bfe6ff 0%,#e4f6ff 55%,#d9f7c8 100%);background-attachment:fixed;color:#3a2e5c;
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
  header{text-align:center;padding:6px 0 12px}
  h1{margin:0;font-size:30px;letter-spacing:1px;color:#ff7a59;text-shadow:0 2px 0 #fff}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;margin:0 auto}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);max-width:820px}}
  .card{position:relative;border:0;border-radius:28px;padding:14px 6px 12px;background:var(--c);
    box-shadow:0 6px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;
    transition:transform .12s;touch-action:manipulation;font-family:inherit;color:inherit}
  .card:active{transform:scale(.95) translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .emo{font-size:min(26vw,120px);line-height:1.1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;display:block}
  .name{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:.5px}
  .card.on{animation:pop .5s ease}
  .card.on .emo{animation:wiggle .7s ease-in-out infinite}
  .card.on::after{content:"";position:absolute;inset:-5px;border-radius:32px;border:5px solid #fff;box-shadow:0 0 18px #fff;pointer-events:none}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}
  /* Πληροφορίες για γονείς: παρατεταμένο πάτημα στον τίτλο */
  #info{position:fixed;inset:0;background:rgba(40,30,70,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
  #info .box{background:#fff;border-radius:20px;padding:18px;max-width:460px;max-height:80vh;overflow:auto;font-family:system-ui,Roboto,sans-serif;font-size:13px;line-height:1.45;color:#333}
  #info h2{margin:0 0 8px;font-size:17px}
  #info button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#ff7a59;color:#fff;font-size:16px;font-weight:700}
</style>
</head>
<body>
<header><h1 id="title">🐾 Ζωάκια 🐾</h1></header>
<main class="grid" id="grid"></main>

<div id="info"><div class="box">
  <h2>Για τους γονείς</h2>
  <div>Πατήστε ένα ζωάκι: ακούγεται το όνομά του και μετά η φωνή του. Το κουμπί «πίσω» είναι απενεργοποιημένο για να μη βγαίνει το παιδί κατά λάθος· βγείτε με το κουμπί αρχικής οθόνης.</div>
  <h2 style="margin-top:14px">Ήχοι (Wikimedia Commons)</h2>
  <div id="credits">—</div>
  <button id="closeInfo">Κλείσιμο</button>
</div></div>

<script>
var ANIMALS=[
  {id:'dog',e:'🐶',n:'Σκύλος',say:'Ο σκύλος!',fx:'γαβ γαβ',c:'#ffd6a5'},
  {id:'cat',e:'🐱',n:'Γάτα',say:'Η γάτα!',fx:'νιάου',c:'#ffadad'},
  {id:'cow',e:'🐮',n:'Αγελάδα',say:'Η αγελάδα!',fx:'μουουου',c:'#caffbf'},
  {id:'sheep',e:'🐑',n:'Πρόβατο',say:'Το πρόβατο!',fx:'μπεεε',c:'#f1f1f1'},
  {id:'goat',e:'🐐',n:'Κατσίκα',say:'Η κατσίκα!',fx:'μεεε',c:'#fdffb6'},
  {id:'horse',e:'🐴',n:'Άλογο',say:'Το άλογο!',fx:'ιιιχιχιχι',c:'#e4c1a1'},
  {id:'pig',e:'🐷',n:'Γουρούνι',say:'Το γουρούνι!',fx:'οινκ οινκ',c:'#ffc6ff'},
  {id:'chicken',e:'🐔',n:'Κότα',say:'Η κότα!',fx:'κο κο κο',c:'#ffe5b4'},
  {id:'rooster',e:'🐓',n:'Κόκορας',say:'Ο κόκορας!',fx:'κικιρίκου',c:'#ffb4a2'},
  {id:'duck',e:'🦆',n:'Πάπια',say:'Η πάπια!',fx:'πα πα πα',c:'#9bf6ff'},
  {id:'lion',e:'🦁',n:'Λιοντάρι',say:'Το λιοντάρι!',fx:'γρρρρ',c:'#ffd166'},
  {id:'elephant',e:'🐘',n:'Ελέφαντας',say:'Ο ελέφαντας!',fx:'τουτουου',c:'#cfd8ff'},
  {id:'monkey',e:'🐵',n:'Μαϊμού',say:'Η μαϊμού!',fx:'ου ου α α',c:'#d4a373'},
  {id:'frog',e:'🐸',n:'Βάτραχος',say:'Ο βάτραχος!',fx:'κουάξ κουάξ',c:'#b9fbc0'},
  {id:'owl',e:'🦉',n:'Κουκουβάγια',say:'Η κουκουβάγια!',fx:'κου κου',c:'#bdb2ff'},
  {id:'wolf',e:'🐺',n:'Λύκος',say:'Ο λύκος!',fx:'αουουου',c:'#c7d2de'}
];
var B=window.KidsBridge||null;
var grid=document.getElementById('grid'),cur=null,audio=null,seq=0;

ANIMALS.forEach(function(a){
  var b=document.createElement('button');
  b.className='card';b.style.setProperty('--c',a.c);b.dataset.id=a.id;
  b.innerHTML='<span class="emo">'+a.e+'</span><span class="name">'+a.n+'</span>';
  b.addEventListener('click',function(){play(a,b)});
  grid.appendChild(b);
});

function mark(el){if(cur)cur.classList.remove('on');cur=el;if(el){el.classList.remove('on');void el.offsetWidth;el.classList.add('on');}}
// Καλείται από την εφαρμογή Android όταν τελειώσει ο ήχος
window.onPlayDone=function(id){if(cur&&cur.dataset.id===id)mark(null);};

function play(a,el){
  mark(el);
  if(B){B.play(a.id,a.say,a.fx);return;}
  // Σκέτος browser: φωνή του browser + αρχείο ήχου
  var my=++seq;
  try{speechSynthesis.cancel();}catch(e){}
  if(audio){try{audio.pause()}catch(e){}audio=null;}
  var done=false;
  function sound(){
    if(done||my!==seq)return;done=true;
    audio=new Audio('sounds/'+a.id+'.ogg');
    audio.onended=function(){if(my===seq)window.onPlayDone(a.id)};
    audio.onerror=function(){if(my===seq)window.onPlayDone(a.id)};
    audio.play().catch(function(){window.onPlayDone(a.id)});
  }
  try{
    var u=new SpeechSynthesisUtterance(a.say);u.lang='el-GR';u.rate=.85;u.pitch=1.15;
    var v=(speechSynthesis.getVoices()||[]).filter(function(x){return /^el/i.test(x.lang)})[0];if(v)u.voice=v;
    u.onend=function(){setTimeout(sound,150)};u.onerror=sound;
    speechSynthesis.speak(u);
    setTimeout(sound,2500); // αν ο browser δεν μιλάει, παίζει ο ήχος έτσι κι αλλιώς
  }catch(e){sound();}
}

// Παρατεταμένο πάτημα (2 δευτ.) στον τίτλο: πληροφορίες για γονείς
(function(){
  var t=null,T=document.getElementById('title');
  T.addEventListener('pointerdown',function(){t=setTimeout(openInfo,2000)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){T.addEventListener(n,function(){clearTimeout(t)})});
  document.getElementById('closeInfo').onclick=function(){document.getElementById('info').style.display='none'};
  function openInfo(){
    document.getElementById('info').style.display='flex';
    var p=(B&&B.credits)?Promise.resolve().then(function(){return JSON.parse(B.credits())}):fetch('credits.json').then(function(r){return r.json()});
    p.then(function(cs){
      var names={};ANIMALS.forEach(function(a){names[a.id]=a.n});
      document.getElementById('credits').innerHTML=cs.map(function(c){
        return '<div style="margin-bottom:6px"><b>'+(names[c.id]||c.id)+'</b>: '+c.file+' — '+(c.artist||'άγνωστος')+' ('+c.license+')</div>';
      }).join('');
    }).catch(function(){});
  }
})();
document.addEventListener('contextmenu',function(e){e.preventDefault()});
</script>
</body>
</html>
